[project]
name = "lms-kgbuild-backend"
version = "0.1.0"
description = "Private RAG + knowledge graph + multi-agent platform (P0 vertical slice)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "minio>=7.2",
    "pymilvus>=2.5,<2.7",
    "openai>=1.50,<3",
    "langgraph>=1.0,<2",
    "arq>=0.26",
    "redis>=5",
    "pypdf>=5",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "jieba>=0.42",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["."]
